name: TryHackMe Streak Bot

on:
  schedule:
    # Run daily at 4:30 PM Sri Lanka time (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: read
  actions: read

jobs:
  maintain-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create account configuration
        run: |
          echo "[account]" > account.conf
          echo "mail = ${{ secrets.THM_EMAIL }}" >> account.conf
          echo "pass = ${{ secrets.THM_PASSWORD }}" >> account.conf
          chmod 600 account.conf

      - name: Run THM Bot with timeout
        id: streak_run
        run: |
          timeout 8m python main.py
          echo "status=success" >> $GITHUB_OUTPUT
        env:
          CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_API_KEY }}
        continue-on-error: true

      - name: Upload log and screenshots as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thm-bot-logs
          path: |
            tryhackmebot.log
            *.png
          retention-days: 7

      - name: Send Telegram notification
        if: always()
        run: |
          STATUS="${{ steps.streak_run.outcome }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TIMESTAMP=$(TZ="Asia/Colombo" date '+%Y-%m-%d %H:%M:%S %Z')
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            MSG="Streak maintained successfully!"
          else
            EMOJI="❌"
            MSG="Streak bot failed! Check logs."
          fi
          TEXT="${EMOJI} *TryHackMe Streak Update*%0A%0A📅 *Time:* ${TIMESTAMP}%0A${MSG}%0A%0A🔗 *Logs:* [View Run](${RUN_URL})%0A%0A_Ghost runner: Your streak guardian_"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "text=${TEXT}"
