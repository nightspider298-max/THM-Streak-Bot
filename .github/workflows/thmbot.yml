name: TryHackMe Streak Bot

on:
  schedule:
    # Run daily at 4:30 PM Sri Lanka time (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: read
  actions: read

jobs:
  maintain-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run THM Bot
        id: streak_run
        env:
          THM_FIREFOX_COOKIES: ${{ secrets.THM_FIREFOX_COOKIES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Wait 60s for Vercel rate limit cooldown on GitHub Actions IPs
          echo "Waiting 60s for rate limit cooldown..."
          sleep 60
          timeout 10m python main.py
          echo "status=success" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thm-bot-logs
          path: logs/
          retention-days: 7
