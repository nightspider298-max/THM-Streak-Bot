name: TryHackMe Streak Bot

on:
  schedule:
    # Run daily at 4:30 PM Sri Lanka time (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: read
  actions: read

jobs:
  maintain-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Firefox and Geckodriver
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox-esr xvfb || sudo apt-get install -y firefox xvfb
          which firefox || which firefox-esr
          firefox --version || firefox-esr --version
          wget -q https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-linux64.tar.gz
          tar -xzf geckodriver-v0.36.0-linux64.tar.gz
          chmod +x geckodriver
          sudo mv geckodriver /usr/local/bin/

      - name: Install FFmpeg
        run: |
          sudo apt-get install -y ffmpeg

      - name: Verify dependency versions
        run: |
          firefox --version
          geckodriver --version
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip show selenium pydub SpeechRecognition

      - name: Create account configuration
        run: |
          echo "[account]" > account.conf
          echo "mail = ${{ secrets.THM_EMAIL }}" >> account.conf
          echo "pass = ${{ secrets.THM_PASSWORD }}" >> account.conf
          chmod 600 account.conf

      - name: Setup virtual display
        run: |
          Xvfb :99 &
          export DISPLAY=:99

      - name: Run THM Bot with timeout
        id: streak_run
        run: |
          timeout 5m python main.py
          echo "status=success" >> $GITHUB_OUTPUT
        env:
          DISPLAY: :99
        continue-on-error: true

      - name: Upload log and screenshots as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thm-bot-logs
          path: |
            tryhackmebot.log
            geckodriver.log
            *.png
          retention-days: 7

      - name: Send Telegram notification
        if: always()
        run: |
          STATUS="${{ steps.streak_run.outcome }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TIMESTAMP=$(TZ="Asia/Colombo" date '+%Y-%m-%d %H:%M:%S %Z')
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            MSG="Streak maintained successfully!"
          else
            EMOJI="❌"
            MSG="Streak bot failed! Check logs."
          fi
          TEXT="${EMOJI} *TryHackMe Streak Update*%0A%0A📅 *Time:* ${TIMESTAMP}%0A${MSG}%0A%0A🔗 *Logs:* [View Run](${RUN_URL})%0A%0A_Ghost runner: Your streak guardian_"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "text=${TEXT}"
